[model]
model_id = "ibm-granite/granite-4.0-1b"
revision = "6a7381ba1f54d684ff508d991aeb7dc580157103"
device = "auto"
dtype = "auto"
temperature = 0.8
top_p = 0.95

[reasoning]
prompt_style = "examples"
candidates = 3
keep_branches = 2
chunk_tokens = 96
# Allow five-rule proofs plus intermediate branches and a final frame.
max_steps = 8
max_expansions = 10
max_pending = 6
max_resamples = 1
max_path_tokens = 512
max_decode_tokens = 2304
max_prefill_tokens = 60000
max_context_tokens = 4096
max_api_calls = 16
max_seconds = 90.0
support_threshold = 0.75
progress_threshold = 0.60
completion_threshold = 0.75
seed = 42

[jev]
model = "jev-1.13.0"
request_timeout = 30.0
max_retries = 2
input_usd_per_million = 0.042

[verdict]
reserve_seconds = 10.0
min_probability = 0.75
