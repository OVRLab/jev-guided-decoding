[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jev-guided-decoding"
version = "0.1.0"
description = "Experimental generation-time Jev guidance with pluggable language-model backends"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx>=0.28.1,<0.29"]

[project.optional-dependencies]
transformers = ["torch==2.8.0", "transformers==4.57.1"]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
jev-decode = "jev_guided_decoding.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_guided_decoding"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
